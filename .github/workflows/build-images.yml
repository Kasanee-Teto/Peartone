name: Build and Push Container Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows triggering manually from the GitHub Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: "1.0.1"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner name
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push peartone-migrator
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Containerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/peartone-migrator:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/peartone-migrator:latest
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      - name: Build and push peartone-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Containerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/peartone-backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/peartone-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push peartone-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Containerfile
          target: runtime
          build-args: |
            VITE_API_BASE_URL=/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/peartone-frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/peartone-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
