name: peartone-stack

services:
  # ============================================================================
  # DATABASE SERVICE (PostgreSQL 17 - Terisolasi di backend-net)
  # ============================================================================
  db:
    image: postgres:17.4-alpine
    container_name: peartone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peartone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peartone_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-peartone_db}
    volumes:
      - pg_data:/var/lib/postgresql/data:Z
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Postgres entrypoint membutuhkan kapabilitas ini sesaat sebelum drop ke UID 70 (postgres)
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peartone_user} -d ${POSTGRES_DB:-peartone_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Port 5432 TIDAK dipublikasikan ke host (least privilege)

  # ============================================================================
  # MIGRATION SERVICE (One-off execution, non-root UID 1000)
  # ============================================================================
  migrate:
    image: ghcr.io/kasanee-teto/peartone-migrator:1.0.1
    container_name: peartone-migrator
    environment:
      NODE_ENV: development
      DATABASE_DEV_URL: postgres://${POSTGRES_USER:-peartone_user}:${POSTGRES_PASSWORD:-peartone_password_change_me}@db:5432/${POSTGRES_DB:-peartone_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    volumes:
      - ./backend/storage:/app/storage:Z
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    command: ["db:migrate"]

  # ============================================================================
  # BACKEND SERVICE (Express 5 + Socket.IO, non-root UID 1000, read-only rootfs)
  # ============================================================================
  backend:
    image: ghcr.io/kasanee-teto/peartone-backend:1.0.1
    container_name: peartone-backend
    restart: unless-stopped
    environment:
      # Catatan: NODE_ENV=development dipertahankan karena config/config.json
      # mewajibkan SSL pada mode production. Untuk produksi riil dengan DB SSL, ubah ke production.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_DEV_URL: postgres://${POSTGRES_USER:-peartone_user}:${POSTGRES_PASSWORD:-peartone_password_change_me}@db:5432/${POSTGRES_DB:-peartone_db}
      JWT_SECRET: ${JWT_SECRET:-dummy_jwt_secret_min_32_characters_long_for_security}
      JWT_ISSUER: ${JWT_ISSUER:-Peartone API}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-Peartone Client}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy_google_id_for_startup}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy_google_secret}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/storage:/app/storage:Z
    networks:
      - backend-net
      - frontend-net
    # Hardening Runtime: cabut semua Linux capabilities, cegah privilege escalation,
    # dan kunci root filesystem menjadi read-only (hanya /app/storage & /tmp yang writable)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    ports:
      - "3000:3000"

  # ============================================================================
  # FRONTEND SERVICE (Vite Static + Nginx Unprivileged UID 101, read-only rootfs)
  # ============================================================================
  frontend:
    image: ghcr.io/kasanee-teto/peartone-frontend:1.0.1
    container_name: peartone-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - frontend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
      - /var/cache/nginx:size=32M,mode=1777
      - /var/run:size=16M,mode=1777

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  pg_data:
